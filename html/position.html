<!doctype html>
<html>
  <head>
    <title>Positioning practice</title>
  </head>
  <body style="height: 3000px; padding-top: 80px; padding-left: 80px">
    <div
      style="
        background-color: green;
        color: white;
        position: fixed;
        left: 0;
        bottom: 0;
        top: 50px;
        width: 60px;
      "
    >
      side bar
      <div
        style="
          background-color: red;
          color: white;
          position: absolute;
          top: 0;
          right: 0;
        "
      >
        X
      </div>
    </div>

    <div
      style="
        background-color: black;
        color: white;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 50px;
      "
    >
      Header
    </div>
    <div style="background-color: lightblue; height: 200px; width: 200px">
      div 1
    </div>
    <div style="background-color: lightcoral; height: 200px; width: 200px">
      div 2
    </div>

    <div
      style="
        background-color: red;
        color: white;
        position: absolute;
        top: 20px;
        right: 20px;
      "
    >
      absolute
    </div>
  </body>
</html>
