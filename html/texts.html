<!doctype html>
<html>
  <head>
    <title>Texts Practice</title>
    <link rel="stylesheet" href="styles/texts.css" />
    <style>
      p {
        font-family: Arial;
        margin-top: 0;
        margin-bottom: 0;
      }

      .video-title {
        font-weight: bold;
        font-size: 18px;
        width: 280px;
        line-height: 24px;
        margin-bottom: 4px;
      }
      .video-stats {
        font-size: 14px;
        color: #606060;
        margin-bottom: 20px;
      }
      .video-author {
        font-size: 14px;
        color: #606060;
        margin-bottom: 20px;
      }
      .video-description {
        font-size: 14px;
        color: #606060;
        width: 280px;
        line-height: 22px;
        margin-bottom: 80px;
      }
      .apple-text {
        font-size: 14px;
        background-color: #e34140;
        color: #fff;
        text-align: center;
        padding: 18px 0;
      }
      .shop-link:hover {
        cursor: pointer;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <p class="video-title">
      Talking Tech and AI with Google CEO Sundar Pichai!
    </p>
    <p class="video-stats">3.4M views &#183; 6 months ago</p>
    <p class="video-author">Marque Bownlee &#10004;</p>
    <p class="video-description">
      Talking Tech and AI on the heelsof Google I/O. Also a daily driver phone
      reveal from Google's CEO. Shoutout to Sundar!
    </p>
    <p class="apple-text">
      Shop early for the best selection of holiday favourites.
      <span class="shop-link">Shop now &#62;</span>
    </p>
  </body>
</html>
